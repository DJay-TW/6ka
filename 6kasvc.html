<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6ka</title>
    <style>
        /* 這裡會自動套用你原本設計好的 UI 畫面外觀 */
    </style>
</head>
<body>

    <input type="range" id="volumeSlider" min="0" max="100" value="80">
    <span id="volumeValue">80%</span>

    <button onclick="sendTestEvent('new_order', '測試新訂單範例')">測試新訂單</button>
    <button onclick="sendTestEvent('device_online', '售票機已連線')">測試售票機連線</button>
    <button onclick="sendTestEvent('device_offline', '售票機連線中斷')">測試售票機斷線</button>
    
    <button onclick="testHourlyAnnounce()">測試整點報時</button>


<script>
    const API_BASE = "https://6kas.jay-fbf.workers.dev";
    const API_TOKEN = "558811566";

    const slider = document.getElementById("volumeSlider");
    const valueLabel = document.getElementById("volumeValue");

    let isUserDragging = false;

    // ──────────────── 1. 音量即時同步與防打架邏輯 ────────────────

    if (slider) {
        // 當使用者滑鼠按住或手指碰觸滑桿時，鎖定暫停背景更新
        slider.addEventListener("mousedown", () => { isUserDragging = true; });
        slider.addEventListener("touchstart", () => { isUserDragging = true; });
        
        // 當使用者放開滑桿時，解鎖並立刻把新音量推播給樹莓派
        slider.addEventListener("mouseup", () => { 
            isUserDragging = false; 
            sendVolumeCommand(slider.value);
        });
        slider.addEventListener("touchend", () => { 
            isUserDragging = false; 
            sendVolumeCommand(slider.value);
        });

        // 拖曳時即時連動數字顯示
        slider.addEventListener("input", () => {
            if (valueLabel) valueLabel.innerText = slider.value + "%";
        });
    }

    // 發送音量調整指令
    function sendVolumeCommand(vol) {
        fetch(`${API_BASE}/push`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                token: API_TOKEN,
                type: "volume",
                device: "web_control",
                volume: parseInt(vol, 10),
                message: `調整音量至 ${vol}%`
            })
        })
        .catch(err => console.error("音量發送錯誤:", err));
    }

    // 定時（每 5 秒）自動去跟雲端拿樹莓派目前的實體音量數字
    function fetchLiveVolume() {
        if (isUserDragging) return; // 如果使用者正在拉，這 5 秒就先不覆蓋畫面

        fetch(`${API_BASE}/get-status`)
            .then(response => response.json())
            .then(data => {
                if (data.success && data.volume !== undefined) {
                    if (slider) slider.value = data.volume;
                    if (valueLabel) valueLabel.innerText = data.volume + "%";
                }
            })
            .catch(err => console.error("無法獲取即時音量:", err));
    }

    // ──────────────── 2. 測試按鈕功能實作 ────────────────

    // 你原本的通用測試發送（幫新訂單自動補上正確的 order_no 欄位）
    function sendTestEvent(type, defaultMessage) {
        const payload = {
            token: API_TOKEN,
            type: type,
            device: "web_control",
            message: defaultMessage
        };

        if (type === "new_order") {
            const randomNo = Math.floor(Math.random() * 900 + 100); // 隨機生成 100~999 單號
            payload.message = `單號 ${randomNo}`;
            payload.order_no = String(randomNo); // 確保樹莓派能抓到純數字
        }

        fetch(`${API_BASE}/push`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) alert(`測試事件 [${type}] 發送成功！`);
        })
        .catch(err => alert("網路請求失敗: " + err));
    }

    // 🌟 新增：報時測試按鈕的後端綁定
    function testHourlyAnnounce() {
        const currentHour = new Date().getHours(); // 自動抓當下電腦/手機的時間小時
        
        const payload = {
            token: API_TOKEN,
            type: "hourly",
            device: "web_control",
            message: `${currentHour}點測試報時`,
            hour: currentHour
        };

        fetch(`${API_BASE}/push`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) alert(`成功發送 ${currentHour} 點整點報時測試！`);
        })
        .catch(err => alert("網路請求失敗: " + err));
    }

    // ──────────────── 3. 初始化啟動 ────────────────
    window.addEventListener("load", () => {
        fetchLiveVolume(); // 剛開網頁先對齊一次音量
        setInterval(fetchLiveVolume, 5000); // 之後每 5 秒自動跟雲端同步
    });
</script>

</body>
</html>
