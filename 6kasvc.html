<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>6KAS Control Pro</title>
  <style>
    :root {
      --bg: #07080a;
      --card: #11131a;
      --accent: #d8b76d;
      --accent-glow: rgba(216, 183, 109, 0.2);
      --text: #f5f7fb;
      --muted: #525a6c;
      /* 調整未點亮柱子顏色，使其可見 */
      --line: rgba(255, 255, 255, 0.12); /* 提高可見度 */
      --bar-unlit: #222530; /* 深灰色未點亮柱子 */
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      height: 100dvh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.7);
    }

    /* 狀態列 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .node-info {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--muted);
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.sync .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status.error .dot { background: #ff5a66; box-shadow: 0 0 8px #ff5a66; }

    /* 數字顯示 */
    .readout {
      text-align: center;
      margin-bottom: 28px;
    }

    .value {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .unit {
      font-size: 24px;
      color: var(--muted);
      margin-left: 2px;
      font-weight: 500;
    }

    /* 21檔高密度滑動區域 */
    .slider-container {
      position: relative;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 24px 12px;
      height: 140px;
      display: grid;
      grid-template-columns: repeat(21, 1fr); /* 細分 21 檔 */
      gap: 4px;
      align-items: end;
      touch-action: none; /* 鎖定手機瀏覽器預設滾動 */
      cursor: pointer;
    }

    .bar {
      width: 100%;
      min-height: 5px;
      border-radius: 99px;
      background: var(--bar-unlit); /* 預設使用深灰色 */
      pointer-events: none; /* 讓事件由父層統一計算 */
      transition: background 0.1s ease, box-shadow 0.1s ease;
    }

    /* 點亮狀態：只點亮當前檔位，不顯示進度 */
    .bar.active {
      background: linear-gradient(180deg, #f3dfae, var(--accent));
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* 下方快切鍵 */
    .quick-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      flex: 1;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      padding: 15px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(0.96);
    }

    .btn-mute { color: #ffbcbc; }
  </style>
</head>
<body>

  <main class="app">
    <header class="header">
      <div class="node-info">6KAS AUDIO</div>
      <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText">READY</span>
      </div>
    </header>

    <section class="readout">
      <div class="value"><span id="currentLevel">50</span><span class="unit">%</span></div>
    </section>

    <section class="slider-container" id="sliderContainer"></section>

    <footer class="quick-actions">
      <button type="button" class="btn btn-mute" onclick="triggerVolume(0)">MUTE</button>
      <button type="button" class="btn" onclick="triggerVolume(10)">NORMAL</button>
      <button type="button" class="btn" onclick="triggerVolume(20)">MAX</button>
    </footer>
  </main>

  <script>
    const API_URL = "https://6kas.jay-fbf.workers.dev/push";
    const TOKEN = "558811566";

    // 自動生成 0, 5, 10, 15 ... 100 % 的 21 檔對照表
    const VOLUME_MAP = {};
    for (let i = 0; i <= 20; i++) {
      VOLUME_MAP[i] = i * 5;
    }

    const container = document.getElementById("sliderContainer");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const currentLevelEl = document.getElementById("currentLevel");

    let isDragging = false;
    let currentLevel = 10; // 預設 50% (即第 10 檔)
    let isSending = false;

    // 1. 動態建立 21 根音量柱
    function initBars() {
      container.innerHTML = "";
      for (let i = 0; i <= 20; i++) {
        const pct = VOLUME_MAP[i];
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.dataset.level = i;
        bar.style.height = `${Math.max(6, pct)}%`; // 確保最低音量也有微小視覺根基
        container.appendChild(bar);
      }
      updateUI(currentLevel);
    }

    // 2. 即時刷新前端發光與數字狀態 (絲滑關鍵)
    function updateUI(level) {
      currentLevel = level;
      currentLevelEl.textContent = VOLUME_MAP[level];
      
      const bars = container.querySelectorAll(".bar");
      bars.forEach(bar => {
        const l = Number(bar.dataset.level);
        // 優化邏輯：獨立檔位指示。只有當前檔位點亮，其餘熄滅。
        // 當 level === 0 (Mute) 時，無任何檔位亮起。
        bar.classList.toggle("active", l === level && level > 0);
      });
    }

    // 3. 計算觸控/滑動落點
    function handlePointer(e) {
      const rect = container.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      let pct = offsetX / rect.width;
      pct = Math.max(0, Math.min(1, pct)); // 極限邊界控制
      
      const level = Math.round(pct * 20); // 映射到 0~20 檔
      if (level !== currentLevel) {
        updateUI(level);
      }
    }

    // 4. Pointer 監聽 (全自動相容手機觸控與滑鼠)
    container.addEventListener("pointerdown", (e) => {
      isDragging = true;
      container.setPointerCapture(e.pointerId);
      handlePointer(e);
    });

    container.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      handlePointer(e);
    });

    container.addEventListener("pointerup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      container.releasePointerCapture(e.pointerId);
      sendVolume(currentLevel); // 放開手指的瞬間，才噴發 API
    });

    // 5. 快切按鈕直接觸發 (Mute=0, Normal=10, Max=20)
    function triggerVolume(level) {
      updateUI(level);
      sendVolume(level);
    }

    // 6. API 發送
    async function sendVolume(level) {
      if (isSending) return;
      isSending = true;

      const volume = VOLUME_MAP[level];
      setStatus("SENDING", "sync");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: TOKEN,
            type: "volume",
            message: String(volume)
          })
        });

        const data = await response.json();
        if (!response.ok || data.success === false) throw new Error();

        setStatus("READY", "sync");
        // 移除額外的 setTimeout，使狀態反饋更直接
      } catch (err) {
        setStatus("ERROR", "error");
      } finally {
        isSending = false;
      }
    }

    function setStatus(text, mode = "idle") {
      statusEl.className = "status " + (mode === "sync" ? "sync" : mode === "error" ? "error" : "");
      statusText.textContent = text;
    }

    initBars();
  </script>
</body>
</html>
