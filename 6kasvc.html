<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6KAS Volume Control</title>
  <style>
    :root {
      --bg: #07080b;
      --panel: rgba(17, 19, 26, 0.84);
      --panel-2: rgba(255, 255, 255, 0.045);
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #f5f7fb;
      --muted: #9aa3b2;
      --soft: #687083;
      --accent: #d8b76d;
      --accent-2: #f1d99a;
      --danger: #ff5a66;
      --shadow: 0 30px 90px rgba(0, 0, 0, 0.58);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(216, 183, 109, 0.15), transparent 30%),
        radial-gradient(circle at 82% 76%, rgba(94, 92, 230, 0.12), transparent 32%),
        linear-gradient(145deg, #050609, #0a0c12 52%, #050609);
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .app {
      width: min(520px, 100%);
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(20, 23, 31, 0.92), rgba(12, 14, 20, 0.92));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,0.07), transparent 36%);
    }

    .top {
      position: relative;
      padding: 30px 30px 22px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.08;
      letter-spacing: 0.01em;
      font-weight: 720;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 116px;
      max-width: 180px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--soft);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.03);
    }

    .status.ok .dot {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(216,183,109,0.12);
    }

    .status.error .dot {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255,90,102,0.12);
    }

    .visual {
      position: relative;
      padding: 16px 30px 8px;
    }

    .bars {
      height: 230px;
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 9px;
      align-items: end;
      padding: 18px 14px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02)),
        rgba(255, 255, 255, 0.025);
    }

    .barButton {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      height: 100%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 9px;
      -webkit-tap-highlight-color: transparent;
    }

    .bar {
      width: 100%;
      min-height: 8px;
      border-radius: 999px 999px 7px 7px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.08);
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }

    .barButton:hover .bar {
      background: rgba(255,255,255,0.14);
      border-color: rgba(216,183,109,0.35);
    }

    .barButton.active .bar {
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 0 28px rgba(216, 183, 109, 0.22);
    }

    .barButton:active .bar {
      transform: scaleY(0.96);
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.02em;
      min-height: 14px;
      white-space: nowrap;
    }

    .barButton.active .label {
      color: var(--text);
    }

    .readout {
      padding: 22px 30px 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
    }

    .currentLabel {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .currentValue {
      font-size: 54px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: -0.04em;
    }

    .currentValue span {
      color: var(--soft);
      font-size: 22px;
      letter-spacing: 0;
      margin-left: 3px;
      font-weight: 600;
    }

    .quick {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .quick button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255,255,255,0.045);
      padding: 11px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.14s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .quick button:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--line-strong);
    }

    .quick button:active {
      transform: scale(0.97);
    }

    .quick .mute {
      color: #ffb4bb;
    }

    .footer {
      padding: 14px 30px 28px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .top {
        padding: 26px 22px 18px;
        display: block;
      }

      .status {
        margin-top: 18px;
        max-width: 100%;
      }

      h1 {
        font-size: 31px;
      }

      .visual {
        padding: 14px 18px 6px;
      }

      .bars {
        height: 210px;
        gap: 6px;
        padding: 16px 10px;
        border-radius: 24px;
      }

      .readout {
        padding: 20px 22px 8px;
        grid-template-columns: 1fr;
        align-items: start;
      }

      .currentValue {
        font-size: 50px;
      }

      .quick {
        justify-content: space-between;
      }

      .quick button {
        flex: 1;
      }

      .footer {
        padding: 14px 22px 26px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <header class="top">
        <div>
          <div class="eyebrow">6KAS Audio Node</div>
          <h1>Volume Control</h1>
          <div class="hint">垂直音量檔位控制。0 為靜音，10 為 100%。</div>
        </div>

        <div id="status" class="status">
          <span class="dot"></span>
          <span id="statusText">待命中</span>
        </div>
      </header>

      <section class="visual">
        <div class="bars" id="bars"></div>
      </section>

      <section class="readout">
        <div>
          <div class="currentLabel">Current Target</div>
          <div class="currentValue"><span id="currentLevel">—</span><span id="currentUnit">%</span></div>
        </div>

        <div class="quick">
          <button type="button" class="mute" onclick="sendVolume(0)">Mute</button>
          <button type="button" onclick="sendVolume(6)">Normal</button>
          <button type="button" onclick="sendVolume(10)">Max</button>
        </div>
      </section>

      <footer class="footer">
        指令會送到 Cloudflare Worker，Pi 輪詢後執行本地音量調整。
      </footer>
    </section>
  </main>

  <script>
    const API_URL = "https://6kas.jay-fbf.workers.dev/push";
    const TOKEN = "558811566";

    const VOLUME_MAP = {
      0: 0,
      1: 10,
      2: 18,
      3: 26,
      4: 34,
      5: 42,
      6: 50,
      7: 60,
      8: 75,
      9: 90,
      10: 100
    };

    const bars = document.getElementById("bars");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const currentLevel = document.getElementById("currentLevel");
    const currentUnit = document.getElementById("currentUnit");

    function setStatus(text, mode = "idle") {
      status.classList.remove("ok", "error");
      if (mode === "ok") status.classList.add("ok");
      if (mode === "error") status.classList.add("error");
      statusText.textContent = text;
    }

    function renderBars() {
      bars.innerHTML = "";

      Object.keys(VOLUME_MAP).map(Number).forEach(level => {
        const volume = VOLUME_MAP[level];
        const button = document.createElement("button");
        button.type = "button";
        button.className = "barButton";
        button.dataset.level = String(level);
        button.setAttribute("aria-label", `Volume ${volume}%`);
        button.onclick = () => sendVolume(level);

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = `${Math.max(6, volume)}%`;

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = level === 0 ? "Mute" : `${volume}`;

        button.appendChild(bar);
        button.appendChild(label);
        bars.appendChild(button);
      });
    }

    function markActive(level) {
      document.querySelectorAll(".barButton").forEach(button => {
        button.classList.toggle("active", Number(button.dataset.level) === level);
      });
    }

    async function sendVolume(level) {
      const volume = VOLUME_MAP[level];
      setStatus(`送出 ${volume}%...`);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: TOKEN,
            type: "volume",
            message: String(volume)
          })
        });

        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        markActive(level);
        currentLevel.textContent = String(volume);
        currentUnit.style.display = "inline";
        setStatus(`已送出 ${volume}%`, "ok");
      } catch (error) {
        setStatus(`送出失敗：${error.message}`, "error");
      }
    }

    renderBars();
  </script>
</body>
</html>
