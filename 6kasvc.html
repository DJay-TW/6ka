<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>6KAS Control Pro</title>
  <style>
    :root {
      --bg: #07080a;
      --card: #11131a;
      --accent: #d8b76d;
      --accent-glow: rgba(216, 183, 109, 0.2);
      --text: #f5f7fb;
      --muted: #525a6c;
      --line: rgba(255, 255, 255, 0.12);
      --bar-unlit: #222530;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      height: 100dvh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.7);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .node-info {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--muted);
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.sync .dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .status.error .dot {
      background: #ff5a66;
      box-shadow: 0 0 8px #ff5a66;
    }

    .readout {
      text-align: center;
      margin-bottom: 28px;
    }

    .value {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .unit {
      font-size: 24px;
      color: var(--muted);
      margin-left: 2px;
      font-weight: 500;
    }

    .slider-container {
      position: relative;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 24px 12px;
      height: 140px;
      display: grid;
      grid-template-columns: repeat(21, 1fr);
      gap: 4px;
      align-items: end;
      touch-action: none;
      cursor: pointer;
    }

    .bar {
      width: 100%;
      min-height: 5px;
      border-radius: 99px;
      background: var(--bar-unlit);
      pointer-events: none;
      transition: background 0.1s ease, box-shadow 0.1s ease;
    }

    .bar.active {
      background: linear-gradient(180deg, #f3dfae, var(--accent));
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .quick-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      flex: 1;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      padding: 15px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(0.96);
    }

    .btn-mute {
      color: #ffbcbc;
    }
  </style>
</head>
<body>

  <main class="app">
    <header class="header">
      <div class="node-info">6KAS AUDIO</div>
      <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText">READY</span>
      </div>
    </header>

    <section class="readout">
      <div class="value"><span id="currentLevel">50</span><span class="unit">%</span></div>
    </section>

    <section class="slider-container" id="sliderContainer"></section>

    <footer class="quick-actions">
      <button type="button" class="btn btn-mute" onclick="triggerVolume(0)">MUTE</button>
      <button type="button" class="btn" onclick="triggerVolume(10)">NORMAL</button>
      <button type="button" class="btn" onclick="triggerVolume(20)">MAX</button>
      <button type="button" class="btn" onclick="testSound()">TEST</button>
    </footer>
  </main>

  <script>
    const API_URL = "https://6kas.jay-fbf.workers.dev/push";
    const TOKEN = "558811566";

    const VOLUME_MAP = {};
    for (let i = 0; i <= 20; i++) {
      VOLUME_MAP[i] = i * 5;
    }

    const container = document.getElementById("sliderContainer");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const currentLevelEl = document.getElementById("currentLevel");

    let isDragging = false;
    let currentLevel = 10;
    let isSending = false;

    function initBars() {
      container.innerHTML = "";

      for (let i = 0; i <= 20; i++) {
        const pct = VOLUME_MAP[i];
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.dataset.level = i;
        bar.style.height = `${Math.max(6, pct)}%`;
        container.appendChild(bar);
      }

      updateUI(currentLevel);
    }

    function updateUI(level) {
      currentLevel = level;
      currentLevelEl.textContent = VOLUME_MAP[level];

      const bars = container.querySelectorAll(".bar");
      bars.forEach(bar => {
        const l = Number(bar.dataset.level);
        bar.classList.toggle("active", l === level && level > 0);
      });
    }

    function handlePointer(e) {
      const rect = container.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;

      let pct = offsetX / rect.width;
      pct = Math.max(0, Math.min(1, pct));

      const level = Math.round(pct * 20);

      if (level !== currentLevel) {
        updateUI(level);
      }
    }

    container.addEventListener("pointerdown", (e) => {
      isDragging = true;
      container.setPointerCapture(e.pointerId);
      handlePointer(e);
    });

    container.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      handlePointer(e);
    });

    container.addEventListener("pointerup", (e) => {
      if (!isDragging) return;

      isDragging = false;
      container.releasePointerCapture(e.pointerId);
      sendVolume(currentLevel);
    });

    function triggerVolume(level) {
      updateUI(level);
      sendVolume(level);
    }

    async function sendVolume(level) {
      if (isSending) return;
      isSending = true;

      const volume = VOLUME_MAP[level];
      setStatus("SENDING", "sync");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: TOKEN,
            type: "volume",
            message: String(volume)
          })
        });

        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error();
        }

        setStatus("READY", "sync");

      } catch (err) {
        setStatus("ERROR", "error");

      } finally {
        isSending = false;
      }
    }

    async function testSound() {
      setStatus("TEST", "sync");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: TOKEN,
            type: "new_order",
            message: "299",
            device: "volume_panel"
          })
        });

        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error();
        }

        setStatus("READY", "sync");

      } catch (err) {
        setStatus("ERROR", "error");
      }
    }

    function setStatus(text, mode = "idle") {
      statusEl.className = "status " + (
        mode === "sync" ? "sync" :
        mode === "error" ? "error" :
        ""
      );

      statusText.textContent = text;
    }

    initBars();
  </script>
</body>
</html>
