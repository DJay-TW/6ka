<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>6KAS Control</title>
  <style>
    :root {
      --bg: #08090c;
      --card: #12141c;
      --accent: #d8b76d;
      --accent-glow: rgba(216, 183, 109, 0.25);
      --text: #f5f7fb;
      --muted: #687083;
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      height: 100dvh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(400px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    }

    /* 頂部狀態 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .node-info {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 600;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid var(--line);
      transition: all 0.2s ease;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.sync .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status.error .dot { background: #ff5a66; box-shadow: 0 0 8px #ff5a66; }

    /* 巨型數字讀數 */
    .readout {
      text-align: center;
      margin-bottom: 24px;
    }

    .value {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .unit {
      font-size: 24px;
      color: var(--muted);
      margin-left: 2px;
    }

    /* 滑動音量條區域 */
    .slider-container {
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px 14px;
      height: 160px;
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 6px;
      align-items: end;
      touch-action: none; /* 關鍵：防止手機瀏覽器上下滾動干擾滑動 */
      cursor: pointer;
    }

    .bar-wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      pointer-events: none; /* 讓事件由父層統一處理 */
    }

    .bar {
      width: 100%;
      min-height: 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .bar-wrapper.active .bar {
      background: linear-gradient(180deg, #f1d99a, var(--accent));
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .bar-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
    }

    .bar-wrapper.active .bar-label {
      color: var(--text);
    }

    /* 底部快捷鍵 */
    .quick-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(0.96);
    }

    .btn-mute { color: #ffb4bb; }
  </style>
</head>
<body>

  <main class="app">
    <header class="header">
      <div class="node-info">6KAS AUDIO</div>
      <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText">READY</span>
      </div>
    </header>

    <section class="readout">
      <div class="value"><span id="currentLevel">50</span><span class="unit">%</span></div>
    </section>

    <!-- 支援拖曳與點擊的音量複合區域 -->
    <section class="slider-container" id="sliderContainer"></section>

    <footer class="quick-actions">
      <button type="button" class="btn btn-mute" onclick="triggerVolume(0)">MUTE</button>
      <button type="button" class="btn" onclick="triggerVolume(6)">NORMAL</button>
      <button type="button" class="btn" onclick="triggerVolume(10)">MAX</button>
    </footer>
  </main>

  <script>
    const API_URL = "https://6kas.jay-fbf.workers.dev/push";
    const TOKEN = "558811566";

    const VOLUME_MAP = {
      0: 0, 1: 10, 2: 18, 3: 26, 4: 34, 5: 42,
      6: 50, 7: 60, 8: 75, 9: 90, 10: 100
    };

    const container = document.getElementById("sliderContainer");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const currentLevelEl = document.getElementById("currentLevel");

    let isDragging = false;
    let currentLevel = 6; // 預設 50% (級距 6)
    let isSending = false;

    // 1. 初始化渲染音量條
    function initBars() {
      container.innerHTML = "";
      Object.keys(VOLUME_MAP).map(Number).forEach(level => {
        const pct = VOLUME_MAP[level];
        const wrapper = document.createElement("div");
        wrapper.className = "bar-wrapper";
        wrapper.dataset.level = level;

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = `${Math.max(6, pct)}%`;

        const label = document.createElement("div");
        label.className = "bar-label";
        label.textContent = level === 0 ? "•" : pct;

        wrapper.appendChild(bar);
        wrapper.appendChild(label);
        container.appendChild(wrapper);
      });
      updateUI(currentLevel);
    }

    // 2. 更新純前端 UI 狀態（極速響應）
    function updateUI(level) {
      currentLevel = level;
      currentLevelEl.textContent = VOLUME_MAP[level];
      
      document.querySelectorAll(".bar-wrapper").forEach(wrapper => {
        const l = Number(wrapper.dataset.level);
        wrapper.classList.toggle("active", l <= level && (level !== 0 || l === 0));
      });
    }

    // 3. 處理觸控、滑動坐標邏輯
    function handlePointer(e) {
      const rect = container.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      let pct = offsetX / rect.width;
      pct = Math.max(0, Math.min(1, pct)); // 限制在 0~1 之間
      
      const level = Math.round(pct * 10);
      if (level !== currentLevel) {
        updateUI(level);
      }
    }

    // 4. 綁定滑動事件（Pointer Events 完美相容全平台觸控）
    container.addEventListener("pointerdown", (e) => {
      isDragging = true;
      container.setPointerCapture(e.pointerId);
      handlePointer(e);
    });

    container.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      handlePointer(e);
    });

    container.addEventListener("pointerup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      container.releasePointerCapture(e.pointerId);
      sendVolume(currentLevel); // 手指離開時才觸發 API 請求
    });

    // 5. 快捷鍵點擊直接觸發
    function triggerVolume(level) {
      updateUI(level);
      sendVolume(level);
    }

    // 6. 送出數據至 Cloudflare Worker
    async function sendVolume(level) {
      if (isSending) return;
      isSending = true;

      const volume = VOLUME_MAP[level];
      setStatus("SENDING", "sync");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: TOKEN,
            type: "volume",
            message: String(volume)
          })
        });

        const data = await response.json();
        if (!response.ok || data.success === false) throw new Error();

        setStatus("READY", "sync");
        setTimeout(() => setStatus("READY", "idle"), 1000);
      } catch (err) {
        setStatus("ERROR", "error");
      } finally {
        isSending = false;
      }
    }

    function setStatus(text, mode = "idle") {
      statusEl.className = "status " + (mode === "sync" ? "sync" : mode === "error" ? "error" : "");
      statusText.textContent = text;
    }

    initBars();
  </script>
</body>
</html>
