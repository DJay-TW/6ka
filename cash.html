<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找零清點 - 量子終端版</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050508;
      --panel: rgba(10, 12, 22, 0.85);
      --panel2: rgba(5, 7, 12, 0.9);
      --text: #e0f7fc;
      --muted: #627b8f;
      --line: #1e293b;
      
      /* 浮誇霓虹色系 */
      --neon-cyan: #00ffcc;
      --neon-magenta: #bd00ff;
      --neon-red: #ff0055;
      --glow-cyan: 0 0 12px rgba(0, 255, 204, 0.6);
      --glow-magenta: 0 0 12px rgba(189, 0, 255, 0.6);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans TC", monospace;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    /* 科技感背景與掃描線 */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 99999;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
      position: relative;
      z-index: 10;
    }

    /* 浮誇外殼與邊框動畫 */
    .card {
      background: var(--panel);
      border: 2px solid #10b981;
      border-image: linear-gradient(to bottom right, var(--neon-cyan), var(--neon-magenta)) 1;
      border-radius: 1px; /* 科技感就是要方正硬朗 */
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.15), inset 0 0 15px rgba(189, 0, 255, 0.1);
      backdrop-filter: blur(10px);
      position: relative;
    }

    /* 角隅裝飾線 */
    .card::before {
      content: "";
      position: absolute;
      top: -2px; left: -2px; width: 20px; height: 20px;
      border-top: 4px solid var(--neon-cyan); border-left: 4px solid var(--neon-cyan);
    }
    .card::after {
      content: "";
      position: absolute;
      bottom: -2px; right: -2px; width: 20px; height: 20px;
      border-bottom: 4px solid var(--neon-magenta); border-right: 4px solid var(--neon-magenta);
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px dashed rgba(0, 255, 204, 0.3);
      padding-bottom: 12px;
    }

    .title h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: var(--glow-cyan);
      text-transform: uppercase;
    }

    /* 狀態燈閃爍 */
    .chip {
      font-size: 12px;
      font-weight: bold;
      padding: 6px 14px;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      background: rgba(0, 255, 204, 0.1);
      box-shadow: var(--glow-cyan);
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.7; box-shadow: 0 0 8px rgba(0, 255, 204, 0.4); }
      50% { opacity: 1; box-shadow: 0 0 18px rgba(0, 255, 204, 0.8); }
      100% { opacity: 0.7; box-shadow: 0 0 8px rgba(0, 255, 204, 0.4); }
    }

    .grid { display: grid; gap: 14px; }
    
    .hdr, .row {
      display: grid;
      grid-template-columns: 90px 1fr 50px 1fr;
      gap: 12px;
      align-items: center;
    }

    .hdr {
      padding: 0 4px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .denom {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
      border-left: 3px solid var(--neon-magenta);
      padding-left: 8px;
    }

    /* 炫目輸入框 */
    input {
      width: 100%;
      font-size: 22px;
      font-weight: bold;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--panel2);
      color: #fff;
      outline: none;
      transition: all 0.25s ease;
      text-align: center;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--neon-cyan);
      box-shadow: var(--glow-cyan), inset 0 0 10px rgba(0,255,204,0.2);
      background: #09141c;
    }

    /* 等號粒子能量按鈕 */
    .eqbtn {
      width: 100%;
      height: 48px;
      border: 1px solid var(--neon-magenta);
      background: rgba(189, 0, 255, 0.1);
      color: var(--neon-magenta);
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .eqbtn:hover {
      background: var(--neon-magenta);
      color: #000;
      box-shadow: var(--glow-magenta);
    }

    .eqbtn:active, .btn:active {
      transform: scale(0.96);
    }

    .actions { display: flex; gap: 12px; margin-top: 18px; }
    .cashbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    
    .cashbox-field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    /* 主按鈕大改裝 */
    .btn {
      flex: 1;
      border: 1px solid var(--neon-cyan);
      background: rgba(0, 255, 204, 0.08);
      color: var(--neon-cyan);
      font-size: 16px;
      font-weight: 800;
      padding: 14px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      text-shadow: 0 0 4px rgba(0,255,204,0.5);
    }

    .btn:hover {
      background: var(--neon-cyan);
      color: #050508;
      box-shadow: var(--glow-cyan);
    }

    .btn.secondary {
      border-color: var(--muted);
      color: var(--text);
      background: transparent;
      text-shadow: none;
    }
    .btn.secondary:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    /* 矩陣終端文字框 */
    textarea {
      width: 100%;
      margin-top: 18px;
      min-height: 240px;
      resize: vertical;
      font-size: 14px;
      line-height: 1.5;
      padding: 14px;
      border: 1px solid rgba(0, 255, 204, 0.2);
      background: #03070d;
      color: var(--neon-cyan);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
      outline: none;
      font-family: inherit;
      white-space: pre;
    }

    .small {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    #sourceInfo {
      color: var(--neon-magenta);
      font-weight: bold;
    }

    /* 粒子特效畫布 */
    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 10000;
      animation: fadeOut 0.6s ease-out forwards;
    }

    @keyframes fadeOut {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
    }

    @media (max-width: 420px) {
      .denom { font-size: 18px; }
      input { font-size: 18px; padding: 8px; }
      .hdr, .row { grid-template-columns: 74px 1fr 44px 1fr; gap: 8px; }
      .eqbtn { height: 42px; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="title">
        <h1>找零金額清點 // QUANTUM_CASH</h1>
        <div class="chip" id="status">Ready</div>
      </div>
      
      <div class="hdr">
        <div>面額</div>
        <div style="padding-left:4px;">A(系統端)</div>
        <div>連動</div>
        <div style="padding-left:4px;">B(實體端)</div>
      </div>
      
      <div class="grid" id="rows"></div>
      
      <div class="cashbox-grid">
        <div class="cashbox-field">
          <label for="cashboxSystem">▶ SYSTEM_CASHBOX_A</label>
          <input id="cashboxSystem" inputmode="numeric" readonly placeholder="SYS_LOCK" />
        </div>
        <div class="cashbox-field">
          <label for="cashboxActual">▶ ACTUAL_CASHBOX_B</label>
          <input id="cashboxActual" inputmode="numeric" placeholder="INPUT" />
        </div>
      </div>
      
      <div class="actions">
        <button class="btn" id="copyBtn">複製核心數據</button>
        <button class="btn secondary" id="refreshBtn">同步系統</button>
        <button class="btn secondary" id="resetBtn">資料清空</button>
      </div>
      
      <textarea id="out" readonly spellcheck="false"></textarea>
      
      <div class="small">
        <span>[SYSTEM] 按下 = 複製矩陣資料 A ➔ B</span>
        <span id="sourceInfo">尚未同步量子數據</span>
      </div>
    </div>
  </div>

<script>
(() => {
  const CASH_API_URL = "https://6ka-cash-diff-api.jay-fbf.workers.dev/api/cash/current";
  const denoms = [500, 100, 50, 10, 5, 1];
  const rowsEl = document.getElementById("rows");
  const outEl = document.getElementById("out");
  const statusEl = document.getElementById("status");
  const sourceInfoEl = document.getElementById("sourceInfo");
  const copyBtn = document.getElementById("copyBtn");
  const refreshBtn = document.getElementById("refreshBtn");
  const resetBtn = document.getElementById("resetBtn");
  const cashboxSystemEl = document.getElementById("cashboxSystem");
  const cashboxActualEl = document.getElementById("cashboxActual");

  const state = {};
  denoms.forEach(d => state[d] = { a: "", b: "" });
  state.cashboxSystem = "";
  state.cashboxActual = "";

  // 💥 浮誇粒子爆裂特效函式 💥
  function createParticles(e, color) {
    const rect = e.target.getBoundingClientRect();
    // 如果是按鈕觸發，取按鈕中心點；否則取滑鼠點擊點
    const x = e.clientX || (rect.left + rect.width / 2);
    const y = e.clientY || (rect.top + rect.height / 2);
    
    for (let i = 0; i < 15; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = color;
      
      // 隨機噴射軌跡與大小
      const size = Math.random() * 6 + 4;
      p.style.width = size + "px";
      p.style.height = size + "px";
      
      const mx = (Math.random() - 0.5) * 150;
      const my = (Math.random() - 0.5) * 150;
      p.style.setProperty('--mx', mx + 'px');
      p.style.setProperty('--my', my + 'px');
      
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  const fmtMoney = n => {
    const value = Math.round(Number(n || 0));
    const sign = value < 0 ? "-" : "";
    return sign + "$" + Math.abs(value).toLocaleString("en-US");
  };

  const sanitize = v => {
    const s = String(v ?? "").replace(/[^\d]/g, "");
    return s.length > 1 ? (s.replace(/^0+/, "") || "0") : s;
  };

  const qty = (denom, side) => {
    const value = state[denom][side];
    if (value === "" || value == null) return 0;
    const number = parseInt(value, 10);
    return Number.isFinite(number) ? number : 0;
  };

  function bump(text) {
    statusEl.textContent = text;
    clearTimeout(bump.timer);
    bump.timer = setTimeout(() => statusEl.textContent = "Ready", 1200);
  }

  function fmtLine(denom, aQty, bQty, diffMoney) {
    if (diffMoney === 0) return `$${denom} ${aQty}=${bQty}`;
    return `$${denom} ${aQty}=${bQty} d${fmtMoney(diffMoney)}`;
  }

  function update() {
    let aTotal = 0;
    let bTotal = 0;
    const lines = ["【 金額差異動態分析報表 】", "==========================="];

    denoms.forEach(denom => {
      const aQty = qty(denom, "a");
      const bQty = qty(denom, "b");
      const aMoney = aQty * denom;
      const bMoney = bQty * denom;
      aTotal += aMoney;
      bTotal += bMoney;
      lines.push(fmtLine(denom, aQty, bQty, bMoney - aMoney));
    });

    lines.push("");
    lines.push(`系統總計 // ${fmtMoney(aTotal)}`);
    lines.push(`實際總計 // ${fmtMoney(bTotal)}`);
    lines.push(`清點差值 // ${fmtMoney(bTotal - aTotal)}`);

    const cashboxSystem = Number(state.cashboxSystem || 0);
    const cashboxActual = Number(state.cashboxActual || 0);
    lines.push("");
    lines.push(`---------------------------`);
    lines.push(`系統錢箱 // ${fmtMoney(cashboxSystem)}`);
    lines.push(`實際錢箱 // ${fmtMoney(cashboxActual)}`);
    lines.push(`錢箱差值 // ${fmtMoney(cashboxActual - cashboxSystem)}`);
    outEl.value = lines.join("\n");
  }

  function buildRows() {
    rowsEl.innerHTML = "";
    denoms.forEach(denom => {
      const row = document.createElement("div");
      row.className = "row";

      const denomEl = document.createElement("div");
      denomEl.className = "denom";
      denomEl.textContent = `$${denom}`;

      const aIn = document.createElement("input");
      aIn.inputMode = "numeric";
      aIn.placeholder = "0";
      aIn.value = state[denom].a;
      aIn.addEventListener("input", (e) => {
        state[denom].a = sanitize(aIn.value);
        if (aIn.value !== state[denom].a) aIn.value = state[denom].a;
        update();
      });
      aIn.addEventListener("focus", (e) => createParticles(e, "var(--neon-cyan)"));

      const bIn = document.createElement("input");
      bIn.inputMode = "numeric";
      bIn.placeholder = "0";
      bIn.value = state[denom].b;
      bIn.addEventListener("input", (e) => {
        state[denom].b = sanitize(bIn.value);
        if (bIn.value !== state[denom].b) bIn.value = state[denom].b;
        update();
      });
      bIn.addEventListener("focus", (e) => createParticles(e, "var(--neon-magenta)"));

      const eq = document.createElement("button");
      eq.className = "eqbtn";
      eq.type = "button";
      eq.textContent = "➔";
      eq.title = "把 A 複製到 B";
      eq.addEventListener("click", (e) => {
        createParticles(e, "var(--neon-magenta)");
        state[denom].b = state[denom].a || "";
        bIn.value = state[denom].b;
        bump("Sync_OK");
        update();
      });

      row.append(denomEl, aIn, eq, bIn);
      rowsEl.appendChild(row);
    });
  }

  async function loadSystemCash() {
    bump("Syncing");
    const response = await fetch(CASH_API_URL, { cache: "no-store" });
    const payload = await response.json();
    if (!payload.ok) throw new Error("SYNC_FAILED");
    denoms.forEach(denom => {
      const row = payload.denominations && payload.denominations[String(denom)];
      state[denom].a = row && row.quantity != null ? String(row.quantity) : "";
    });
    state.cashboxSystem = payload.cashbox && payload.cashbox.system_amount != null ? String(payload.cashbox.system_amount) : "";
    cashboxSystemEl.value = state.cashboxSystem;
    buildRows();
    update();
    const total = fmtMoney(payload.usable_total_amount);
    const time = payload.generated_at ? new Date(payload.generated_at).toLocaleTimeString("zh-TW", { hour12: false }) : "-";
    sourceInfoEl.textContent = `量子帳目: ${total} / 同步時間: ${time}`;
    bump("Online");
  }

  async function copyOutput(e) {
    createParticles(e, "var(--neon-cyan)");
    try {
      await navigator.clipboard.writeText(outEl.value || "");
      bump("Copied");
    } catch {
      outEl.focus();
      outEl.select();
      document.execCommand("copy");
      bump("Copied");
    }
  }

  function resetActual(e) {
    createParticles(e, "var(--neon-red)");
    denoms.forEach(d => state[d].b = "");
    state.cashboxActual = "";
    cashboxActualEl.value = "";
    buildRows();
    update();
    bump("Wiped");
  }

  cashboxActualEl.addEventListener("input", () => {
    state.cashboxActual = sanitize(cashboxActualEl.value);
    if (cashboxActualEl.value !== state.cashboxActual) cashboxActualEl.value = state.cashboxActual;
    update();
  });
  cashboxActualEl.addEventListener("focus", (e) => createParticles(e, "var(--neon-cyan)"));

  copyBtn.addEventListener("click", copyOutput);
  refreshBtn.addEventListener("click", (e) => {
    createParticles(e, "var(--neon-cyan)");
    loadSystemCash().catch(error => bump("Error"));
  });
  resetBtn.addEventListener("click", resetActual);

  buildRows();
  update();
  loadSystemCash().catch(error => {
    sourceInfoEl.textContent = "OFFLINE_MODE // 核心斷開連線";
    bump("Offline");
  });
})();
</script>
</body>
</html>
