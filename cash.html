<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>找零清點 - NERV 終極量子終端</title>
  <link rel="icon" type="image/png" href="cash-diff-icon.png" />
  <link rel="apple-touch-icon" href="cash-diff-icon.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #010204;
      --panel: rgba(5, 7, 12, 0.82);
      /* 修改為半透明底色，讓底層 Canvas 特效可以完美透上來 */
      --panel2: rgba(2, 3, 5, 0.55); 
      --text: #e5f7ff;
      --muted: #435b6e;
      
      --neon-cyan: #00ffcc;
      --neon-magenta: #ff00ff;
      --neon-amber: #ff9900;
      --neon-red: #ff003c;
      
      --glow-cyan: 0 0 18px #00ffcc, inset 0 0 12px rgba(0, 255, 204, 0.4);
      --glow-magenta: 0 0 18px #ff00ff, inset 0 0 12px rgba(255, 0, 255, 0.4);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "Helvetica Neue", Arial, "Noto Sans TC", ui-monospace, monospace;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    /* 手機專用主容器 */
    .wrap {
      width: 100%;
      max-width: 440px;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* NERV 核心卡片 */
    .card {
      width: 100%;
      flex: 1;
      background: var(--panel);
      border: 2px solid transparent;
      border-image: linear-gradient(135deg, var(--neon-cyan) 30%, #005544, var(--neon-magenta) 70%) 1;
      position: relative;
      padding: 14px 12px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 🎨 特效 Canvas：留置於 UI 內容下方 (z-index: 1) 做為背景發光層 */
    #fxCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
      -webkit-transform: translate3d(0,0,0);
      transform: translate3d(0,0,0);
    }

    /* 🚨 紅色核爆警報文字疊加層 */
    #alertOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 0, 60, 0.22); 
      z-index: 9999; 
      pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.1s ease;
      -webkit-transform: translate3d(0,0,0);
      transform: translate3d(0,0,0);
    }
    .alert-banner {
      background: var(--neon-red); color: #fff; font-size: 18px; font-weight: 900;
      padding: 8px 24px; letter-spacing: 3px; text-shadow: 0 0 8px #000;
      box-shadow: 0 0 25px var(--neon-red); transform: skewX(-12deg);
      animation: blink 0.25s infinite alternate;
    }
    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }

    /* 背景細節層 */
    .hex-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      opacity: 0.1;
      background: repeating-linear-gradient(30deg, var(--neon-cyan) 0 1px, transparent 1px 24px);
      z-index: 0;
    }

    .glass-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 25%, rgba(255,255,255,0.02) 26%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.03) 61%);
      background-size: 300% 300%;
      animation: glare 12s linear infinite;
      z-index: 0;
    }
    @keyframes glare { 0% { background-position: 0% 0%; } 100% { background-position: 300% 300%; } }

    .noise-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 4px;
      z-index: 0;
    }

    /* EVA 四角 L-Brackets */
    .bracket { position: absolute; width: 20px; height: 20px; pointer-events: none; z-index: 25; }
    .b-tl { top: -2px; left: -2px; border-top: 5px solid var(--neon-cyan); border-left: 5px solid var(--neon-cyan); }
    .b-tr { top: -2px; right: -2px; border-top: 5px solid var(--neon-cyan); border-right: 5px solid var(--neon-cyan); }
    .b-bl { bottom: -2px; left: -2px; border-bottom: 5px solid var(--neon-magenta); border-left: 5px solid var(--neon-magenta); }
    .b-br { bottom: -2px; right: -2px; border-bottom: 5px solid var(--neon-magenta); border-right: 5px solid var(--neon-magenta); }

    .hazard-edge {
      position: absolute; top: 0; right: 25px; width: 60px; height: 3px;
      background: repeating-linear-gradient(-45deg, #000, #000 4px, var(--neon-amber) 4px, var(--neon-amber) 8px);
      z-index: 20; opacity: 0.5;
    }

    .nerv-tag { font-size: 8px; color: var(--muted); letter-spacing: 0.5px; position: absolute; font-weight: bold; z-index: 20; }
    .tag-tr { top: 4px; right: 12px; color: var(--neon-cyan); }
    .tag-bl { bottom: 4px; left: 12px; opacity: 0.5; color: var(--neon-magenta); }

    /* 📱 UI 內容包裝層 - z-index 提高，內部元件自帶層級以接受透光 */
    .ui-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* 標題與晶片狀態 */
    .title {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; border-bottom: 1px dashed rgba(0, 255, 204, 0.2); padding-bottom: 6px;
      flex-shrink: 0;
    }
    .title h1 { font-size: 15px; font-weight: 900; letter-spacing: 0.5px; color: #fff; text-shadow: 0 0 10px var(--neon-cyan); }
    .chip {
      font-size: 9px; font-weight: bold; padding: 1px 8px;
      border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
      background: rgba(0, 255, 204, 0.1); box-shadow: var(--glow-cyan);
    }

    /* 彈性欄位容器 */
    .grid-container {
      display: flex;
      flex-direction: column;
      flex: 1; 
      min-height: 160px; 
      margin-bottom: 6px;
      overflow: hidden;
    }
    .grid { 
      display: flex; 
      flex-direction: column; 
      gap: 5px; 
      overflow-y: auto; 
      padding-right: 2px;
      flex: 1;
      -webkit-overflow-scrolling: touch; 
    }
    .hdr, .row { display: grid; grid-template-columns: 72px 1fr 34px 1fr; gap: 5px; align-items: center; }
    .hdr { padding: 2px 4px; color: var(--muted); font-size: 9px; font-weight: bold; flex-shrink: 0; text-align: center;}
    .hdr div:first-child { text-align: left; }

    /* 面額文字欄位 */
    .denom-block {
      display: flex; flex-direction: column; justify-content: center;
      border-left: 3px solid var(--neon-magenta); padding-left: 5px;
      height: 36px;
      position: relative; z-index: 2;
    }
    .denom-kanji { font-size: 13px; font-weight: 900; color: #fff; line-height: 1.1; }
    .denom-kana { font-size: 8px; color: var(--neon-cyan); opacity: 0.7; margin-top: 1px; }

    /* 🔥【關鍵修正】半透明輸入框 + 後端融合模式，讓底部的光線可以穿透出來 */
    input {
      width: 100%; font-size: 16px; font-weight: bold; padding: 7px 2px;
      border: 1px solid rgba(255,255,255,0.08); 
      background: var(--panel2); /* 半透明背景 */
      color: #fff;
      outline: none; transition: all 0.15s ease; text-align: center; font-family: inherit;
      border-radius: 0; 
      -webkit-appearance: none;
      position: relative; 
      z-index: 2; 
      backdrop-filter: blur(2px); /* 讓穿透的光線帶有微微的科幻毛玻璃折射感 */
      -webkit-backdrop-filter: blur(2px);
    }
    /* 聚焦時提升亮度與層級 */
    input:focus { border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); background: rgba(4, 10, 14, 0.75); z-index: 3; }

    /* ➔ 同步按鈕也改為半透明背景，接受橫向切裂光的微光透射 */
    .eqbtn {
      width: 100%; height: 36px; border: 1px solid var(--neon-magenta);
      background: rgba(255, 0, 255, 0.08); color: var(--neon-magenta);
      font-size: 14px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
      position: relative; z-index: 2;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .eqbtn:hover, .eqbtn:active { background: var(--neon-magenta); color: #000; box-shadow: var(--glow-magenta); }

    /* 錢箱區塊 */
    .cashbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 2px; flex-shrink: 0; }
    .cashbox-field label { display: block; color: var(--muted); font-size: 9px; font-weight: bold; margin-bottom: 2px; }

    /* 功能按鈕 */
    .actions { display: flex; gap: 5px; margin-top: 6px; flex-shrink: 0; }
    .btn {
      flex: 1; font-size: 11px; font-weight: 900; padding: 10px 2px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(255,255,255,0.01);
      transition: all 0.15s ease; font-family: inherit;
      border-radius: 0;
      position: relative; z-index: 2;
    }
    
    #copyBtn { border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
    #copyBtn:hover, #copyBtn:active { background: var(--neon-cyan); color: #000; box-shadow: var(--glow-cyan); }

    #refreshBtn { border: 1px solid var(--neon-amber); color: var(--neon-amber); }
    #refreshBtn:hover, #refreshBtn:active { background: var(--neon-amber); color: #000; box-shadow: 0 0 12px var(--neon-amber); }

    #resetBtn { border: 1px solid var(--neon-red); color: var(--neon-red); }
    #resetBtn:hover, #resetBtn:active { background: var(--neon-red); color: #fff; box-shadow: 0 0 12px var(--neon-red); }

    /* 報告輸出區 */
    textarea {
      width: 100%; margin-top: 6px; 
      flex: 1; min-height: 75px; resize: none;
      font-size: 10.5px; letter-spacing: 0.3px; line-height: 1.35; padding: 8px;
      border: 1px solid rgba(0, 255, 204, 0.1); background: rgba(1, 3, 5, 0.85); color: var(--neon-cyan);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.95); outline: none; font-family: inherit;
      white-space: pre; overflow-x: auto; border-radius: 0;
      position: relative; z-index: 2;
    }

    .small { margin-top: 4px; color: var(--muted); font-size: 8.5px; display: flex; justify-content: space-between; gap: 6px; flex-shrink: 0; }
    #sourceInfo { color: var(--neon-magenta); font-weight: bold; }

    .shake { animation: cardShake 0.06s linear infinite; }
    @keyframes cardShake {
      0% { transform: translate(3px, 2px) rotate(0deg); }
      20% { transform: translate(-2px, -3px) rotate(-1deg); }
      40% { transform: translate(-4px, 0px) rotate(1deg); }
      60% { transform: translate(0px, 3px) rotate(0deg); }
      80% { transform: translate(2px, -2px) rotate(1deg); }
      100% { transform: translate(-2px, 3px) rotate(-1deg); }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card" id="mainCard">
      <div class="hex-grid"></div>
      <div class="glass-layer"></div>
      <div class="noise-layer"></div>
      <div class="bracket b-tl"></div><div class="bracket b-tr"></div>
      <div class="bracket b-bl"></div><div class="bracket b-br"></div>
      <div class="hazard-edge"></div>
      <div class="nerv-tag tag-tr">NERV_SYS // REV.06</div>
      <div class="nerv-tag tag-bl">LOC_CORE_35.45_N</div>

      <div class="ui-content">
        <div class="title">
          <h1>找零清點 // QUANTUM_CORE</h1>
          <div class="chip" id="status">Ready</div>
        </div>
        
        <div class="grid-container">
          <div class="hdr">
            <div>面額構成</div>
            <div>A(系統)</div>
            <div>同步</div>
            <div>B(實際)</div>
          </div>
          <div class="grid" id="rows"></div>
        </div>
        
        <div class="cashbox-grid">
          <div class="cashbox-field">
            <label for="cashboxSystem">▶ SYSTEM_CBOX_A</label>
            <input id="cashboxSystem" inputmode="numeric" readonly placeholder="LOCKED" />
          </div>
          <div class="cashbox-field">
            <label for="cashboxActual">▶ ACTUAL_CBOX_B</label>
            <input id="cashboxActual" inputmode="numeric" placeholder="INPUT" />
          </div>
        </div>
        
        <div class="actions">
          <button class="btn" id="copyBtn">複製核心數據</button>
          <button class="btn" id="refreshBtn">同步系統</button>
          <button class="btn" id="resetBtn">資料清空</button>
        </div>
        
        <textarea id="out" readonly spellcheck="false"></textarea>
        
        <div class="small">
          <span>[SYS] 矩陣複製 A ➔ B</span>
          <span id="sourceInfo">尚未同步量子數據</span>
        </div>
      </div>

      <canvas id="fxCanvas"></canvas>
      <div id="alertOverlay"><div class="alert-banner">警 告 / PATTERN BLUE</div></div>

    </div>
  </div>

<script>
(() => {
  const CASH_API_URL = "https://6ka-cash-diff-api.jay-fbf.workers.dev/api/cash/current";
  
  const denomConfigs = [
    { value: 500, kanji: "伍百圓", kana: "ごひゃくえん" },
    { value: 100, kanji: "壱百圓", kana: "ひゃくえん" },
    { value: 50,  kanji: "五拾圓", kana: "ごじゅうえん" },
    { value: 10,  kanji: "壱拾圓", kana: "じゅうえん" },
    { value: 5,   kanji: "五圓",   kana: "ごえん" },
    { value: 1,   kanji: "壱圓",   kana: "いちえん" }
  ];
  const denoms = denomConfigs.map(c => c.value);

  const cardEl = document.getElementById("mainCard");
  const rowsEl = document.getElementById("rows");
  const outEl = document.getElementById("out");
  const statusEl = document.getElementById("status");
  const sourceInfoEl = document.getElementById("sourceInfo");
  const copyBtn = document.getElementById("copyBtn");
  const refreshBtn = document.getElementById("refreshBtn");
  const resetBtn = document.getElementById("resetBtn");
  const cashboxSystemEl = document.getElementById("cashboxSystem");
  const cashboxActualEl = document.getElementById("cashboxActual");
  const alertOverlay = document.getElementById("alertOverlay");

  const state = {};
  denoms.forEach(d => state[d] = { a: "", b: "" });
  state.cashboxSystem = "";
  state.cashboxActual = "";

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playTone(freq, type, duration, startTime = 0) {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime + startTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + startTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + startTime); osc.stop(audioCtx.currentTime + startTime + duration);
    } catch(e) {}
  }

  function playInputFeedbackSound() { playTone(880, 'sine', 0.03, 0); }
  function playCopySound() {
    playTone(523.25, 'sine', 0.15, 0);
    playTone(659.25, 'sine', 0.15, 0.08);
    playTone(783.99, 'sine', 0.25, 0.16);
  }
  function playSyncSound() {
    playTone(440, 'sine', 0.12, 0); playTone(554.37, 'sine', 0.12, 0.06);
    playTone(659.25, 'sine', 0.12, 0.12); playTone(880, 'sine', 0.3, 0.18);
  }

  function playExplosionSound() {
    try {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(30, now + 1.8);
      gainNode.gain.setValueAtTime(0.25, now);
      gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
      osc.connect(gainNode); gainNode.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 1.8);

      const bufferSize = audioCtx.sampleRate * 2.0;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.3, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
      noise.connect(noiseGain); noiseGain.connect(audioCtx.destination);
      noise.start(now); noise.stop(now + 2.0);
    } catch(e) {}
  }

  // 🎨 Canvas 特效引擎
  const canvas = document.getElementById("fxCanvas");
  const ctx = canvas.getContext("2d");
  
  let particles = [];
  let pillars = [];
  let rings = [];
  let explosions = [];
  let scanY = 0;
  let amberAngle = 0;
  let showAmberUI = false;
  let amberTimer = 0;

  function resizeCanvas() {
    const rect = cardEl.getBoundingClientRect();
    canvas.width = rect.width; canvas.height = rect.height;
  }
  const resizeObserver = new ResizeObserver(() => resizeCanvas());
  resizeObserver.observe(cardEl);
  resizeCanvas();

  function triggerCyanPillars() {
    pillars = [];
    const positions = [canvas.width * 0.2, canvas.width * 0.5, canvas.width * 0.8];
    positions.forEach(x => {
      pillars.push({ x: x, width: Math.random() * 30 + 25, alpha: 1.0, decay: 0.02 });
    });
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: canvas.width * 0.5 + (Math.random() - 0.5) * canvas.width,
        y: canvas.height,
        vx: (Math.random() - 0.5) * 5, vy: -(Math.random() * 6 + 3),
        size: Math.random() * 5 + 2, color: "#00ffcc", life: 1.0, decay: Math.random() * 0.02 + 0.01
      });
    }
  }

  function triggerAmberRings() {
    showAmberUI = true; amberTimer = 120;
    rings.push({ x: canvas.width / 2, y: canvas.height / 2, r: 10, maxR: canvas.width * 0.9, alpha: 1, decay: 0.015 });
  }

  // 點擊「資料清空」時，動態將 Canvas 升到最頂層 (99999) 實現全覆蓋摧毀，隨後降回 (1)
  function triggerPatternBlueExplosion() {
    canvas.style.zIndex = "99999"; 
    alertOverlay.style.opacity = "1";
    cardEl.classList.add("shake");
    
    setTimeout(() => {
      alertOverlay.style.opacity = "0";
      cardEl.classList.remove("shake");
      canvas.style.zIndex = "1"; 
    }, 2000);

    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        const exX = Math.random() * canvas.width;
        const exY = Math.random() * canvas.height;
        explosions.push({
          x: exX, y: exY, r: 0, maxR: canvas.width * 1.5,
          color: i % 2 === 0 ? "rgba(255, 0, 60, 0.85)" : "rgba(255, 255, 255, 0.9)"
        });

        for (let j = 0; j < 10; j++) {
          particles.push({
            x: exX, y: exY,
            vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
            size: Math.random() * 6 + 3, color: "#ff003c", life: 1.0, decay: 0.015
          });
        }
      }, i * 200);
    }
  }

  function triggerFocusPulse(e) {
    const rect = cardEl.getBoundingClientRect();
    const targetRect = e.target.getBoundingClientRect();
    const clickX = targetRect.left - rect.left + targetRect.width / 2;
    const clickY = targetRect.top - rect.top + targetRect.height / 2;
    rings.push({ x: clickX, y: clickY, r: 5, maxR: canvas.width * 1.2, alpha: 1.0, decay: 0.03 });
  }

  function triggerRowSyncCut(e) {
    const rect = cardEl.getBoundingClientRect();
    const targetRect = e.target.getBoundingClientRect();
    const targetY = targetRect.top - rect.top + targetRect.height / 2;

    pillars.push({
      x: canvas.width / 2, width: 22, alpha: 1.4, decay: 0.04,
      isRowCut: true, yPosition: targetY
    });
  }

  function renderLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = "lighter";

    scanY += 2; if (scanY > canvas.height) scanY = 0;
    ctx.strokeStyle = "rgba(0, 255, 204, 0.06)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, scanY); ctx.lineTo(canvas.width, scanY); ctx.stroke();

    pillars.forEach((p, idx) => {
      p.alpha -= p.decay;
      if (p.alpha <= 0) { pillars.splice(idx, 1); return; }

      if (p.isRowCut) {
        let grad = ctx.createLinearGradient(0, p.yPosition, canvas.width, p.yPosition);
        grad.addColorStop(0, "rgba(255, 0, 255, 0)");
        grad.addColorStop(0.5, `rgba(255, 255, 255, ${p.alpha * 0.95})`);
        grad.addColorStop(1, "rgba(255, 0, 255, 0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, p.yPosition - p.width/2, canvas.width, p.width);
      } else {
        let grad = ctx.createLinearGradient(p.x, canvas.height, p.x, 0);
        grad.addColorStop(0, `rgba(0, 255, 204, ${p.alpha * 0.7})`);
        grad.addColorStop(0.4, `rgba(255, 255, 255, ${p.alpha * 0.8})`);
        grad.addColorStop(1, "rgba(0, 255, 204, 0)");
        ctx.fillStyle = grad;
        ctx.fillRect(p.x - p.width/2, 0, p.width, canvas.height);
      }
    });

    if (showAmberUI) {
      amberAngle += 0.025; amberTimer--;
      if (amberTimer <= 0) showAmberUI = false;
      ctx.save(); ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.strokeStyle = "rgba(255, 153, 0, 0.35)"; ctx.lineWidth = 3; ctx.setLineDash([20, 20]);
      ctx.beginPath(); ctx.arc(0, 0, canvas.width * 0.4, amberAngle, amberAngle + Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    rings.forEach((r, idx) => {
      r.r += (r.maxR - r.r) * 0.06; r.alpha -= r.decay;
      if (r.alpha <= 0) { rings.splice(idx, 1); return; }
      ctx.strokeStyle = `rgba(0, 255, 204, ${r.alpha})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    });

    explosions.forEach((ex, idx) => {
      ex.r += (ex.maxR - ex.r) * 0.08;
      if (ex.r >= ex.maxR - 5) { explosions.splice(idx, 1); return; }
      let pct = ex.r / ex.maxR;
      ctx.strokeStyle = ex.color; ctx.lineWidth = 8 * (1 - pct);
      ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.stroke();
    });

    particles.forEach((p, idx) => {
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0) { particles.splice(idx, 1); return; }
      ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1.0;
    });

    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  // ⚙️ 業務邏輯
  const fmtMoney = n => {
    const value = Math.round(Number(n || 0));
    const sign = value < 0 ? "-" : "";
    return sign + "$" + Math.abs(value).toLocaleString("en-US");
  };

  const sanitize = v => {
    const s = String(v ?? "").replace(/[^\d]/g, "");
    return s.length > 1 ? (s.replace(/^0+/, "") || "0") : s;
  };

  const qty = (denom, side) => {
    const value = state[denom][side];
    if (value === "" || value == null) return 0;
    return parseInt(value, 10) || 0;
  };

  function bump(text) {
    statusEl.textContent = text;
    clearTimeout(bump.timer);
    bump.timer = setTimeout(() => statusEl.textContent = "Ready", 1200);
  }

  function fmtLine(denom, aQty, bQty, diffMoney) {
    if (diffMoney === 0) return `$${denom} ${aQty}=${bQty}`;
    return `$${denom} ${aQty}=${bQty} d${fmtMoney(diffMoney)}`;
  }

  function update() {
    let aTotal = 0; let bTotal = 0;
    const lines = ["【 金額差異動態分析報表 】", "==========================="];

    denoms.forEach(denom => {
      const aQty = qty(denom, "a"); const bQty = qty(denom, "b");
      const aMoney = aQty * denom; const bMoney = bQty * denom;
      aTotal += aMoney; bTotal += bMoney;
      lines.push(fmtLine(denom, aQty, bQty, bMoney - aMoney));
    });

    lines.push("");
    lines.push(`系統總計 // ${fmtMoney(aTotal)}`);
    lines.push(`實際總計 // ${fmtMoney(bTotal)}`);
    lines.push(`清點差值 // ${fmtMoney(bTotal - aTotal)}`);

    const cashboxSystem = Number(state.cashboxSystem || 0);
    const cashboxActual = Number(state.cashboxActual || 0);
    lines.push(""); lines.push(`---------------------------`);
    lines.push(`系統錢箱 // ${fmtMoney(cashboxSystem)}`);
    lines.push(`實際錢箱 // ${fmtMoney(cashboxActual)}`);
    lines.push(`錢箱差值 // ${fmtMoney(cashboxActual - cashboxSystem)}`);
    outEl.value = lines.join("\n");
  }

  function buildRows() {
    rowsEl.innerHTML = "";
    denomConfigs.forEach(cfg => {
      const denom = cfg.value;
      const row = document.createElement("div"); row.className = "row";

      const denomBlock = document.createElement("div"); denomBlock.className = "denom-block";
      const kanjiEl = document.createElement("div"); kanjiEl.className = "denom-kanji"; kanjiEl.textContent = cfg.kanji;
      const kanaEl = document.createElement("div"); kanaEl.className = "denom-kana"; kanaEl.textContent = cfg.kana;
      denomBlock.append(kanjiEl, kanaEl);

      const aIn = document.createElement("input"); aIn.inputMode = "numeric"; aIn.placeholder = "0"; aIn.value = state[denom].a;
      aIn.addEventListener("focus", (e) => triggerFocusPulse(e));
      aIn.addEventListener("input", () => {
        playInputFeedbackSound();
        state[denom].a = sanitize(aIn.value);
        if (aIn.value !== state[denom].a) aIn.value = state[denom].a;
        update();
      });

      const bIn = document.createElement("input"); bIn.inputMode = "numeric"; bIn.placeholder = "0"; bIn.value = state[denom].b;
      bIn.addEventListener("focus", (e) => triggerFocusPulse(e));
      bIn.addEventListener("input", () => {
        playInputFeedbackSound();
        state[denom].b = sanitize(bIn.value);
        if (bIn.value !== state[denom].b) bIn.value = state[denom].b;
        update();
      });

      const eq = document.createElement("button"); eq.className = "eqbtn"; eq.type = "button"; eq.textContent = "➔";
      eq.addEventListener("click", (e) => {
        playTone(580, 'sine', 0.12);
        triggerRowSyncCut(e);
        state[denom].b = state[denom].a || "";
        bIn.value = state[denom].b;
        bump("Sync_OK"); update();
      });

      row.append(denomBlock, aIn, eq, bIn); rowsEl.appendChild(row);
    });
  }

  async function loadSystemCash() {
    bump("Syncing");
    const response = await fetch(CASH_API_URL, { cache: "no-store" });
    const payload = await response.json();
    if (!payload.ok) throw new Error("SYNC_FAILED");
    denoms.forEach(denom => {
      const row = payload.denominations && payload.denominations[String(denom)];
      state[denom].a = row && row.quantity != null ? String(row.quantity) : "";
    });
    state.cashboxSystem = payload.cashbox && payload.cashbox.system_amount != null ? String(payload.cashbox.system_amount) : "";
    cashboxSystemEl.value = state.cashboxSystem;
    buildRows(); update();
    const total = fmtMoney(payload.usable_total_amount);
    const time = payload.generated_at ? new Date(payload.generated_at).toLocaleTimeString("zh-TW", { hour12: false }) : "-";
    sourceInfoEl.textContent = `量子帳目: ${total} [${time}]`; bump("Online");
  }

  copyBtn.addEventListener("click", async () => {
    playCopySound(); triggerCyanPillars();
    try {
      await navigator.clipboard.writeText(outEl.value || ""); bump("Copied");
    } catch {
      outEl.focus(); outEl.select(); document.execCommand("copy"); bump("Copied");
    }
  });

  refreshBtn.addEventListener("click", () => {
    playSyncSound(); triggerAmberRings();
    loadSystemCash().catch(() => bump("Error"));
  });

  resetBtn.addEventListener("click", () => {
    playExplosionSound(); triggerPatternBlueExplosion();
    denoms.forEach(d => state[d].b = "");
    state.cashboxActual = ""; cashboxActualEl.value = "";
    buildRows(); update(); bump("Wiped");
  });

  cashboxActualEl.addEventListener("focus", (e) => triggerFocusPulse(e));
  cashboxActualEl.addEventListener("input", () => {
    playInputFeedbackSound();
    state.cashboxActual = sanitize(cashboxActualEl.value);
    if (cashboxActualEl.value !== state.cashboxActual) cashboxActualEl.value = state.cashboxActual;
    update();
  });

  buildRows(); update();
  loadSystemCash().catch(() => {
    sourceInfoEl.textContent = "OFFLINE_MODE // 核心連線中斷"; bump("Offline");
  });
})();
</script>
</body>
</html>
